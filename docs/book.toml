[book]
title = "Netscope field notes"
description = "Learn how Netscope inspects HAR and PCAP captures, replays reviewed requests, and why it is built this way."
language = "en"
src = "."

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/sidsharma96/netscope"
default-theme = "light"
preferred-dark-theme = "navy"
site-url = "/"
no-section-label = false

[output.html.search]
enable = true

[output.html.playground]
runnable = false
copyable = true
