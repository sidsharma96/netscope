name: Documentation site
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-site
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    env:
      MDBOOK_VERSION: 0.5.4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check the Markdown sources
        run: python3 scripts/check_docs.py
      - name: Build the book
        run: |
          mdbook --version
          mdbook build docs
          # mdBook copies every non-Markdown file from its source directory,
          # including its own configuration; the site does not need it.
          rm -f docs/book/book.toml
      - name: Check the built site
        run: python3 scripts/check_docs.py --site docs/book
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages deploy docs/book --project-name=netscope-docs --branch=main
      - name: Note a skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare secrets are not configured; the site was built and checked but not deployed."
