[package]
name = "netscope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "A beginner-friendly terminal inspector for HAR, PCAP, TCP streams, and HTTP replay"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["network", "http", "har", "pcap"]
categories = ["command-line-utilities", "network-programming"]
license.workspace = true

[lints]
workspace = true

[dependencies]
netscope-core.workspace = true
netscope-import.workspace = true
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
unicode-width = "=0.2.0"
unicode-segmentation = "1.12"
netscope-net = { version = "0.2.1", path = "../netscope-net" }

[[bin]]
name = "netscope"
path = "src/main.rs"

[dev-dependencies]
base64 = "0.22"
serde_json = "1.0"

[lib]
name = "netscope_tui"
